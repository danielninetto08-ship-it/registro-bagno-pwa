<html lang="it">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro Bagno</title>
<meta name="theme-color" content="#1f4fd8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro Bagno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{color-scheme:light dark;--bg:#f2f4f7;--surface:#fff;--fg:#14213d;--muted:#5b6678;--line:#d9dee7;--accent:#1f4fd8;--accent-fg:#fff;--danger:#c62828}
  @media (prefers-color-scheme: dark){:root{--bg:#0f1624;--surface:#18223a;--fg:#e8edf7;--muted:#9aa7bf;--line:#2b3857;--accent:#6c8cff;--accent-fg:#0b1220;--danger:#ff6b6b}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  h2{font-size:1.05rem;margin:0 0 10px}
  label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
  input{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:12px 16px;min-height:44px;width:100%;margin-top:10px;background:var(--accent);color:var(--accent-fg)}
  button:disabled{opacity:.6;cursor:wait}
  input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #errore{min-height:1.3em;margin:8px 0 0;font-size:.9rem;color:var(--danger)}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h2>Accesso</h2>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="off" required>
  <button id="go" type="submit">Entra</button>
  <p id="errore" role="alert"></p>
</form>
